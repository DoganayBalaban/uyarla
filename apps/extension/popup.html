<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>uyarla</title>
    <style>
      :root {
        --bg: #ffffff; --fg: #0f172a; --muted: #64748b; --line: #e2e8f0; --card: #f8fafc;
        --brand: #4f46e5; --brand-hover: #4338ca; --brand-soft: #eef2ff;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b1020; --fg: #e2e8f0; --muted: #94a3b8; --line: #1e293b; --card: #111833; --brand-soft: #1e1b4b; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; width: 320px; background: var(--bg); color: var(--fg); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
      .mark { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--brand); color: #fff; font-weight: 800; font-size: 13px; }
      .brand { font-weight: 700; }
      .tagline { margin-left: auto; color: var(--muted); font-size: 12px; }
      main { padding: 14px 16px 6px; }
      h1 { margin: 0; font-size: 15px; font-weight: 650; }
      .detail { margin: 4px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); font-size: 13px; }
      .primary { margin-top: 12px; width: 100%; border: 0; border-radius: 999px; padding: 10px 14px; background: var(--brand); color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
      .primary:hover { background: var(--brand-hover); }
      .primary:disabled { opacity: .6; cursor: default; }
      .hint { margin: 10px 0 0; color: var(--muted); font-size: 12.5px; }
      .loading { color: var(--muted); }
      nav { margin: 14px 16px 0; padding-top: 12px; border-top: 1px solid var(--line); }
      .label { margin: 0 0 6px; color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
      .links { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .links button { text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; cursor: pointer; }
      .links button:hover { border-color: var(--brand); background: var(--brand-soft); }
      footer { margin: 12px 16px 14px; padding-top: 10px; border-top: 1px solid var(--line); }
      .toggle { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; cursor: pointer; }
      .toggle input { margin-top: 2px; accent-color: var(--brand); }
      .toggle small { display: block; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <span class="mark" aria-hidden="true">u</span>
      <span class="brand">uyarla</span>
      <span class="tagline">Her ilana, doğru CV</span>
    </header>
    <main>
      <p id="loading" class="loading">Sayfaya bakıyoruz…</p>
      <div id="state" hidden>
        <h1 id="title"></h1>
        <p id="detail" class="detail" hidden></p>
        <button id="action" class="primary" type="button" hidden></button>
        <p id="hint" class="hint" hidden></p>
      </div>
    </main>
    <nav aria-label="uyarla'da aç">
      <p class="label">uyarla'da aç</p>
      <div id="links" class="links"></div>
    </nav>
    <footer>
      <label class="toggle">
        <input id="pageButton" type="checkbox" checked />
        <span>İlan sayfalarında düğme göster<small>LinkedIn, Kariyer.net ve diğer iş sitelerinde ilanın yanında.</small></span>
      </label>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
