packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true

# pnpm 11 bağımlılıkların kurulum betiklerini varsayılan olarak engelliyor.
# Bu üçü ikili indirmek zorunda: esbuild (vitest), prisma (sorgu motoru).
onlyBuiltDependencies:
  - esbuild
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
  # bullmq bağımlılığı; ikili derleme gerektiriyor
  - msgpackr-extract
