services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Değerler .env dosyasından okunur. Varsayılan yok: eksikse
      # compose sessizce zayıf bir parolayla ayağa kalkmasın, gürültüyle dursun.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER gerekli — .env.example dosyasına bak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli — .env.example dosyasına bak}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB gerekli — .env.example dosyasına bak}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
